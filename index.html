    --paper:#FBF8F3; --card:#FFFFFF; --line:#EAE3D6;

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  li a:hover{transform:translateY(-1px);border-color:var(--primary);}
  li a .arw{color:var(--primary-600);font-weight:800;}
  li a .who b{color:var(--primary-600);}
  li.past a{padding:11px 20px;font-size:13.5px;font-weight:600;color:var(--ink-2);box-shadow:none;background:transparent;}
  li.past .who em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);
    background:#ECEAE5;border-radius:999px;padding:2px 9px;margin-left:9px;}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-3);line-height:1.9;text-align:center;}
